<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hispasat 30.0°W — Abertis & Cellnex Package</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Alpine Plugins MUST be included before Alpine Core for x-collapse to work -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .glass-card:hover { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); }
        .glass-nav { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body x-data="appData()" x-init="init()" class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950/40 via-slate-950 to-black antialiased selection:bg-blue-500 selection:text-white pb-20">

    <header class="sticky top-0 z-40 glass-nav shadow-lg shadow-black/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="relative flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-[0_0_20px_rgba(59,130,246,0.4)] border border-blue-400/30">
                    <i class="fa-solid fa-satellite-dish text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
                        Hispasat 30.0°W - Abertis & Cellnex Package
                    </h1>
                    <p class="text-xs text-slate-400 font-medium flex items-center gap-2">
                        <span>SAT Chart</span>
                        <span class="inline-block w-1 h-1 rounded-full bg-slate-600"></span>
                        <span class="text-emerald-400 drop-shadow-[0_0_5px_rgba(52,211,153,0.5)]">Live Sync</span>
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="edit.html" class="px-5 py-2.5 rounded-2xl bg-slate-800/80 hover:bg-blue-600 text-white text-xs font-bold border border-slate-700 hover:border-blue-500 transition-all flex items-center gap-2 group shadow-lg">
                    <i class="fa-solid fa-pen-to-square group-hover:scale-110 transition-transform"></i>
                    <span>Edit Data</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <!-- Stats Grid -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
            <template x-for="(stat, i) in [
                { label: 'Transponders', val: stats.totalTxp, icon: 'fa-tower-broadcast', color: 'text-blue-400' },
                { label: 'Streams', val: stats.totalStreams, icon: 'fa-network-wired', color: 'text-indigo-400' },
                { label: 'TV Channels', val: stats.totalTv, icon: 'fa-tv', color: 'text-emerald-400' },
                { label: 'Radio Stations', val: stats.totalRadio, icon: 'fa-radio', color: 'text-amber-400' }
            ]">
                <div class="glass-card rounded-3xl p-5 relative overflow-hidden group">
                    <div class="absolute -right-4 -bottom-4 opacity-5 group-hover:opacity-10 transition-opacity transform group-hover:scale-110 duration-500">
                        <i :class="`fa-solid ${stat.icon} text-8xl`"></i>
                    </div>
                    <div class="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2 flex items-center gap-2">
                        <i :class="`fa-solid ${stat.icon} ${stat.color}`"></i>
                        <span x-text="stat.label"></span>
                    </div>
                    <div class="text-4xl font-black text-white tracking-tight drop-shadow-md" x-text="stat.val"></div>
                </div>
            </template>
        </section>

        <!-- Search Filters -->
        <section class="glass-card rounded-3xl p-2 md:p-3 flex items-center bg-slate-900/80 shadow-[0_4px_20px_rgba(0,0,0,0.3)]">
            <div class="relative w-full">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-blue-500 text-lg"></i>
                <input type="text" x-model="search" placeholder="Search channels, PIDs, SIDs, streams, frequencies..." 
                       class="w-full pl-14 pr-4 py-4 rounded-2xl bg-transparent border-none text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-0 text-sm font-medium transition-colors">
            </div>
        </section>

        <!-- Transponders List -->
        <div class="space-y-6">
            <template x-for="(txp, index) in filteredData" :key="index">
                <!-- Dropdown TXP State -->
                <div x-data="{ txpExpanded: true }" class="glass-card rounded-3xl overflow-hidden border border-slate-800/80 shadow-xl shadow-black/40">
                    
                    <!-- TXP Header (Clickable) -->
                    <div @click="txpExpanded = !txpExpanded" 
                         class="p-5 md:p-6 bg-gradient-to-r from-slate-900 via-slate-900/95 to-slate-800/50 border-b border-slate-800/80 flex flex-col md:flex-row md:items-center justify-between gap-4 relative overflow-hidden cursor-pointer hover:bg-slate-800/60 transition-colors group/header">
                        <div class="absolute top-0 left-0 w-1.5 h-full bg-gradient-to-b from-blue-400 to-blue-600 shadow-[0_0_15px_rgba(59,130,246,0.6)]"></div>
                        
                        <div>
                            <div class="flex items-center gap-3 mb-2">
                                <span class="px-3 py-1 rounded-lg bg-blue-600/20 border border-blue-500/30 text-blue-400 font-extrabold text-xs shadow-[0_0_10px_rgba(59,130,246,0.15)]" x-text="`TXP ${txp.txp_no}`"></span>
                                <h2 class="text-xl md:text-2xl font-black text-white tracking-tight group-hover/header:text-blue-200 transition-colors" x-text="txp.freq_pol_mode"></h2>
                            </div>
                            <div class="flex flex-wrap items-center gap-x-5 gap-y-2 text-xs font-medium text-slate-400">
                                <span class="flex items-center gap-2"><i class="fa-solid fa-building text-slate-500"></i> <span x-text="txp.provider"></span></span>
                                <span class="flex items-center gap-2"><i class="fa-solid fa-wave-square text-slate-500"></i> <span class="text-slate-300 font-bold" x-text="`SR: ${txp.sr_fec}`"></span></span>
                                <span class="flex items-center gap-2 code-font bg-slate-950/50 px-2.5 py-1 rounded-md text-slate-300 border border-slate-800" x-text="`ID: ${txp.onid_nid_tid}`"></span>
                            </div>
                        </div>
                        
                        <div class="flex items-center gap-4 self-start md:self-center">
                            <div class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1.5 rounded-xl border border-emerald-500/20 shadow-[0_0_10px_rgba(16,185,129,0.1)] flex items-center gap-2">
                                <i class="fa-solid fa-clock-rotate-left"></i>
                                <span x-text="`Updated: ${txp.date}`"></span>
                            </div>
                            <!-- Expand Arrow -->
                            <div class="w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 border border-slate-700 group-hover/header:bg-slate-700 transition-colors">
                                <i class="fa-solid fa-chevron-down text-slate-400 transition-transform duration-300" :class="txpExpanded ? 'rotate-180' : ''"></i>
                            </div>
                        </div>
                    </div>

                    <!-- TXP Body (Collapsible) -->
                    <div x-show="txpExpanded" x-collapse>
                        <div class="p-4 md:p-6 space-y-5 bg-slate-950/70">
                            <template x-for="(stream, sIndex) in txp.streams" :key="sIndex">
                                <!-- Dropdown Stream State -->
                                <div x-data="{ streamExpanded: true }" class="rounded-2xl border border-slate-800/60 bg-slate-900/40 overflow-hidden group/stream hover:border-slate-700 transition-colors shadow-lg shadow-black/20">
                                    
                                    <!-- Stream Header (Clickable) -->
                                    <div @click="streamExpanded = !streamExpanded" 
                                         class="px-5 py-3.5 bg-slate-900/90 border-b border-slate-800/60 flex flex-wrap items-center justify-between gap-3 cursor-pointer hover:bg-slate-800/80 transition-colors">
                                        <div class="flex items-center gap-3">
                                            <div class="w-2 h-2 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.8)]"></div>
                                            <h3 class="font-bold text-sm text-slate-100" x-text="stream.title"></h3>
                                            <template x-if="stream.encryption">
                                                <span class="px-2.5 py-0.5 rounded text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 shadow-[0_0_8px_rgba(245,158,11,0.15)] flex items-center gap-1.5 ml-2">
                                                    <i class="fa-solid fa-lock text-[9px]"></i> <span x-text="stream.encryption"></span>
                                                </span>
                                            </template>
                                        </div>
                                        <div class="flex items-center gap-4">
                                            <span class="text-xs code-font text-blue-400 font-bold bg-blue-500/10 px-2.5 py-1 rounded-lg border border-blue-500/20" x-text="`PID: ${stream.pid_info}`"></span>
                                            <!-- Expand Arrow -->
                                            <i class="fa-solid fa-chevron-down text-slate-500 transition-transform duration-300" :class="streamExpanded ? 'rotate-180' : ''"></i>
                                        </div>
                                    </div>

                                    <!-- Stream Body / Channels Table (Collapsible) -->
                                    <div x-show="streamExpanded" x-collapse class="overflow-x-auto">
                                        <table class="w-full text-left text-xs whitespace-nowrap">
                                            <thead class="bg-slate-950/80 text-slate-400 uppercase font-bold tracking-wider border-b border-slate-800">
                                                <tr>
                                                    <th class="py-4 px-5 w-24">Type</th>
                                                    <th class="py-4 px-5">Channel Name</th>
                                                    <th class="py-4 px-5">Codec</th>
                                                    <th class="py-4 px-5">SID</th>
                                                    <th class="py-4 px-5">V.PID</th>
                                                    <th class="py-4 px-5">A.PID / Lang</th>
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-800/40 text-slate-300">
                                                <template x-for="(ch, cIndex) in stream.channels" :key="cIndex">
                                                    <tr class="hover:bg-slate-800/60 transition-all duration-200 group/row border-l-2 border-transparent hover:border-blue-500">
                                                        
                                                        <td class="py-4 px-5 align-top">
                                                            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md border font-black text-[10px] tracking-wide"
                                                                  :class="{
                                                                      'bg-purple-500/10 text-purple-400 border-purple-500/20 shadow-[0_0_10px_rgba(168,85,247,0.2)]': ch.type === 'UHD',
                                                                      'bg-cyan-500/10 text-cyan-400 border-cyan-500/20 shadow-[0_0_10px_rgba(6,182,212,0.2)]': ch.type === 'HD',
                                                                      'bg-slate-700/50 text-slate-300 border-slate-600/50': ch.type === 'SD',
                                                                      'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 shadow-[0_0_10px_rgba(16,185,129,0.2)]': ch.type === 'Radio'
                                                                  }">
                                                                  <i class="fa-solid" :class="ch.type === 'Radio' ? 'fa-microphone-lines' : (ch.type === 'UHD' ? 'fa-display' : 'fa-tv')"></i>
                                                                  <span x-text="ch.type"></span>
                                                            </span>
                                                        </td>
                                                        
                                                        <td class="py-4 px-5 align-top whitespace-normal min-w-[180px]">
                                                            <span class="font-extrabold text-slate-100 group-hover/row:text-blue-400 transition-colors text-[13px]" x-text="formatChannelName(ch.name)"></span>
                                                        </td>
                                                        
                                                        <td class="py-4 px-5 align-top">
                                                            <template x-if="ch.system">
                                                                <span class="bg-slate-800 border border-slate-700 text-slate-300 font-bold px-2 py-1 rounded text-[10px] tracking-wider" x-text="ch.system"></span>
                                                            </template>
                                                            <template x-if="!ch.system"><span class="text-slate-600">—</span></template>
                                                        </td>
                                                        
                                                        <td class="py-4 px-5 align-top">
                                                            <span class="code-font text-blue-300 font-bold bg-blue-900/20 px-2 py-0.5 rounded" x-text="ch.sid || '—'"></span>
                                                        </td>
                                                        
                                                        <td class="py-4 px-5 align-top">
                                                            <div x-html="formatPids(ch.vpid, 'vpid')"></div>
                                                        </td>
                                                        
                                                        <td class="py-4 px-5 align-top">
                                                            <div x-html="formatPids(ch.apid_lang, 'apid')"></div>
                                                        </td>
                                                    </tr>
                                                </template>
                                                <template x-if="!stream.channels || stream.channels.length === 0">
                                                    <tr><td colspan="6" class="py-8 text-center text-slate-500 font-medium italic bg-slate-900/20">No matching channels in this multiplex stream.</td></tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

    <script>
        function appData() {
            return {
                rawData: [],
                search: '',
                async init() {
                    try {
                        let res = await fetch('sat_data.json');
                        this.rawData = await res.json();
                    } catch (e) { console.error("Failed to load JSON", e); }
                },
                
                // Formats camelCase and interconnected names into proper capitalized, spaced labels
                formatChannelName(name) {
                    if (!name) return '—';
                    return name
                        .replace(/([a-z])([A-Z])/g, '$1 $2')         // Add space between lowercase and uppercase
                        .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')    // Add space between uppercase words (e.g. TVCanarias -> TV Canarias)
                        .replace(/([a-zA-Z])(\d)/g, '$1 $2')          // Add space between letter and number
                        .replace(/(\d)([a-zA-Z])/g, '$1 $2')          // Add space between number and letter
                        .replace(/_/g, ' ')                           // Replace underscores with spaces
                        .replace(/\b\w/g, char => char.toUpperCase()) // Capitalize each word
                        .trim();
                },

                // Transforms continuous PID strings (e.g. '1503 Spa 1504 org') into structured vertical columns
                formatPids(pidStr, type = 'vpid') {
                    if (!pidStr || pidStr === '—' || pidStr === 'N/A') return '<span class="text-slate-600 font-medium">—</span>';
                    
                    let str = String(pidStr);
                    let matches = str.match(/\d+[^0-9]*/g); // Matches the numeric PID alongside any following alphabet identifiers
                    
                    let badgeClass = type === 'vpid' 
                        ? 'text-indigo-300 bg-indigo-500/10 border-indigo-500/20 shadow-[0_0_8px_rgba(99,102,241,0.15)]' 
                        : 'text-amber-300 bg-amber-500/10 border-amber-500/20 shadow-[0_0_8px_rgba(245,158,11,0.15)]';
                    
                    if (matches) {
                        return `<div class="flex flex-col gap-2">` + matches.map(m => {
                            let parts = m.trim().split(' ');
                            let pid = parts.shift();
                            let lang = parts.join(' ');
                            return `<div class="flex items-center gap-2">
                                        <span class="font-bold border px-2 py-0.5 rounded text-[11px] code-font ${badgeClass}">${pid}</span>
                                        ${lang ? `<span class="text-slate-300 text-[10px] font-bold uppercase tracking-widest bg-slate-800/80 border border-slate-700 px-2 py-0.5 rounded shadow-sm">${lang}</span>` : ''}
                                    </div>`;
                        }).join('') + `</div>`;
                    }
                    return `<span class="text-slate-400 code-font">${str}</span>`;
                },

                get stats() {
                    let totalTxp = this.rawData.length;
                    let totalStreams = 0, totalTv = 0, totalRadio = 0;
                    this.rawData.forEach(txp => {
                        if (txp.streams) {
                            totalStreams += txp.streams.length;
                            txp.streams.forEach(s => {
                                (s.channels || []).forEach(ch => { ch.type === 'Radio' ? totalRadio++ : totalTv++; });
                            });
                        }
                    });
                    return { totalTxp, totalStreams, totalTv, totalRadio };
                },

                get filteredData() {
                    let q = this.search.toLowerCase().trim();
                    if (!q) return this.rawData;
                    
                    return this.rawData.map(txp => {
                        // Check if the overall transponder matches the search string
                        let txpMatches = txp.freq_pol_mode.toLowerCase().includes(q) || (txp.onid_nid_tid && txp.onid_nid_tid.toLowerCase().includes(q));
                        
                        let matchingStreams = (txp.streams || []).map(stream => {
                            // Check if the parent stream title/PID matches the search string
                            let streamMatches = stream.title.toLowerCase().includes(q) || (stream.pid_info && stream.pid_info.toLowerCase().includes(q));
                            
                            let matchingChannels = (stream.channels || []).filter(ch => 
                                (ch.name && ch.name.toLowerCase().includes(q)) || 
                                (ch.sid && ch.sid.toString().includes(q)) || 
                                (ch.vpid && ch.vpid.toString().includes(q)) ||
                                (ch.apid_lang && ch.apid_lang.toLowerCase().includes(q))
                            );

                            // FIX: If stream or transponder matches the search term directly, display the stream with ALL of its channels intact
                            if (streamMatches || txpMatches) {
                                return { ...stream };
                            }
                            
                            // Otherwise, filter to only the exact channels matched inside the stream
                            if (matchingChannels.length > 0) {
                                return { ...stream, channels: matchingChannels };
                            }
                            
                            return null;
                        }).filter(Boolean);

                        // Return the matched transponder containing correctly filtered streams
                        if (txpMatches || matchingStreams.length > 0) {
                            return { ...txp, streams: matchingStreams };
                        }
                        return null;
                    }).filter(Boolean);
                }
            };
        }
    </script>
</body>
</html>
