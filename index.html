    <title>Hispasat 30.0°W — Abertis & Cellnex Package</title>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } } } }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); transition: transform 0.2s ease, box-shadow 0.2s ease; }
        .glass-card:hover { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 10px 40px -10px rgba(0,0,0,0.5); }
        .glass-nav { background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

        /* ── PID / SID display animations ─────────────────────── */
        .pid-row { animation: pidSlideIn 0.3s cubic-bezier(0.21, 1.02, 0.73, 1) both; }
        @keyframes pidSlideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }
        .sid-badge { animation: sidPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
        @keyframes sidPop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }

<body x-data="appData()" x-init="init()" class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950/40 via-slate-950 to-black antialiased selection:bg-blue-500 selection:text-white pb-20">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">

                                                                      'bg-slate-700/50 text-slate-300 border-slate-600/50': ch.type === 'SD',

                                                            </template>
                                                            <template x-if="!ch.system"><span class="text-slate-600">—</span></template>
                                                        </td>

                                                        <!-- Enhanced SID display -->
                                                        <td class="py-4 px-5 align-top">
                                                            <div class="flex flex-col items-start gap-1">
                                                                <span class="sid-badge inline-flex items-center gap-1.5 code-font font-bold text-[11px] tracking-wide text-cyan-200 bg-gradient-to-r from-cyan-500/20 to-blue-500/10 border border-cyan-400/30 px-2.5 py-1 rounded-lg shadow-[0_0_12px_rgba(6,182,212,0.25)] hover:border-cyan-400/60 hover:shadow-[0_0_16px_rgba(6,182,212,0.4)] transition-all cursor-default" title="Service ID">

                </div>

    <script>
        /* ═══════════════ PID / SID DISPLAY HELPERS ═══════════════ */

        // Escapes unsafe characters before injecting into x-html
        function escHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Splits a continuous PID string such as
        // "4002 E-AC3 Spa 4003 E-AC3 org 4004 AC4 Spa 4005 E-AC3 N/A"
        // into structured rows → [{ pid:'4002', codec:'E-AC3', lang:'SPA' }, …]
        // A PID is a *standalone* number token (bounded by spaces / string edges),
        // so digits inside codec names like "E-AC3" or "AC4" are correctly ignored.
        function parsePidList(pidStr) {
            if (pidStr === null || pidStr === undefined) return null;
            const str = String(pidStr).trim();
            if (!str || str === '—' || /^n\/?a$/i.test(str)) return null;

            const numRegex = /(?:^|\s)(\d+)(?=\s|$)/g;
            const marks = [];
            let m;
            while ((m = numRegex.exec(str)) !== null) {
                marks.push({
                    pid: m[1],
                    pidStart: m.index + (m[0].length - m[1].length),
                    textStart: m.index + m[0].length
                });
            }
            if (marks.length === 0) return null;

            return marks.map((mark, i) => {
                const end = (i + 1 < marks.length) ? marks[i + 1].pidStart : str.length;
                const rawText = str.slice(mark.textStart, end).replace(/\s+/g, ' ').trim();
                return { pid: escHtml(mark.pid), ...splitCodecLang(rawText) };
            });
        }

        // Separates the codec ("E-AC3", "AC4", "MPEG"…) from the language ("Spa", "Eng"…)
        function splitCodecLang(text) {
            if (!text) return { codec: '', lang: '' };
            const codecPattern = /(HE-?AAC(?:\s*\d+)?|E-?AC-?3|DD\+|AC-?4|AC-?3|AAC(?:-?LC)?|HEVC|H\.?26[45]|AVC|MPEG-?\d?(?:\s?Layer\s*(?:I{1,3}|\d+))?|MP3|MP2|DTS(?:-HD)?|LPCM|PCM)/i;
            const m = text.match(codecPattern);
            if (!m) return { codec: '', lang: escHtml(text) };
            const lang = (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim();
            return { codec: m[0].toUpperCase(), lang: escHtml(lang) };
        }

        // Colour-codes each codec family
        function getCodecStyle(codec) {
            const c = (codec || '').toUpperCase();
            if (/E-?AC-?3|DD\+|DDP|DOLBY DIGITAL PLUS/.test(c)) return 'bg-violet-500/15 text-violet-300 border-violet-400/30 shadow-[0_0_8px_rgba(139,92,246,0.25)]';
            if (/AC-?4/.test(c)) return 'bg-rose-500/15 text-rose-300 border-rose-400/30 shadow-[0_0_8px_rgba(244,63,94,0.25)]';
            if (/HE-?AAC/.test(c)) return 'bg-teal-500/15 text-teal-300 border-teal-400/30 shadow-[0_0_8px_rgba(20,184,166,0.25)]';
            if (/AAC/.test(c)) return 'bg-cyan-500/15 text-cyan-300 border-cyan-400/30 shadow-[0_0_8px_rgba(6,182,212,0.25)]';
            if (/AC-?3|DOLBY/.test(c)) return 'bg-sky-500/15 text-sky-300 border-sky-400/30 shadow-[0_0_8px_rgba(14,165,233,0.25)]';
            if (/HEVC|AVC|H\.?26[45]/.test(c)) return 'bg-emerald-500/15 text-emerald-300 border-emerald-400/30 shadow-[0_0_8px_rgba(16,185,129,0.25)]';
            if (/MPEG|MP[23]/.test(c)) return 'bg-orange-500/15 text-orange-300 border-orange-400/30 shadow-[0_0_8px_rgba(249,115,22,0.25)]';
            if (/DTS/.test(c)) return 'bg-fuchsia-500/15 text-fuchsia-300 border-fuchsia-400/30 shadow-[0_0_8px_rgba(217,70,239,0.25)]';
            if (/PCM/.test(c)) return 'bg-lime-500/15 text-lime-300 border-lime-400/30 shadow-[0_0_8px_rgba(132,204,22,0.25)]';
            return 'bg-slate-700/30 text-slate-300 border-slate-500/30';
        }

        function appData() {
            return {
                rawData: [],
                search: '',
                async init() {
                    try {
                        let res = await fetch('sat_data.json');
                        this.rawData = await res.json();
                    } catch (e) { console.error("Failed to load JSON", e); }
                },

                // Formats camelCase and interconnected names into proper capitalized, spaced labels
                formatChannelName(name) {
                    if (!name) return '—';
                    return name
                        .replace(/([a-z])([A-Z])/g, '$1 $2')
                        .replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2')
                        .replace(/([a-zA-Z])(\d)/g, '$1 $2')
                        .replace(/(\d)([a-zA-Z])/g, '$1 $2')
                        .replace(/_/g, ' ')
                        .replace(/\b\w/g, char => char.toUpperCase())
                        .trim();
                },

                // Micro-label under the SID badge (adds hex representation when numeric)
                formatSidLabel(sid) {
                    if (sid === null || sid === undefined || sid === '') return 'Service ID';
                    const n = parseInt(sid, 10);
                    if (isNaN(n)) return 'Service ID';
                    return `Service ID · 0x${n.toString(16).toUpperCase().padStart(4, '0')}`;
                },

                // Builds ONE ROW PER PID with enhanced graphics
                formatPids(pidStr, type = 'vpid') {
                    if (pidStr === null || pidStr === undefined) return '<span class="inline-block text-slate-600 font-medium px-1">—</span>';
                    const str = String(pidStr).trim();
                    if (!str || str === '—' || /^n\/?a$/i.test(str)) return '<span class="inline-block text-slate-600 font-medium px-1">—</span>';

                    const items = parsePidList(str);
                    if (!items) return `<span class="code-font text-slate-400 text-[11px]">${escHtml(str)}</span>`;

                    const isVideo = type === 'vpid';

                    // PID number chip: indigo for video, amber for audio
                    const pidChip = isVideo
                        ? 'text-indigo-200 bg-gradient-to-r from-indigo-500/30 to-indigo-600/10 border-indigo-400/40 shadow-[0_0_12px_rgba(99,102,241,0.3)]'
                        : 'text-amber-200 bg-gradient-to-r from-amber-500/30 to-amber-600/10 border-amber-400/40 shadow-[0_0_12px_rgba(245,158,11,0.3)]';
                    const hoverRow = isVideo ? 'hover:border-indigo-500/50' : 'hover:border-amber-500/50';
                    const icon = isVideo ? 'fa-film' : 'fa-volume-high';

                    // Counter shown when a channel carries multiple PIDs
                    const countLabel = items.length > 1
                        ? `<div class="flex items-center gap-1.5 mb-1 pl-1 text-[8.5px] font-extrabold uppercase tracking-[0.18em] ${isVideo ? 'text-indigo-400/80' : 'text-amber-500/80'}">
                               <i class="fa-solid fa-layer-group text-[8px]"></i>${items.length} ${isVideo ? 'Video Streams' : 'Audio Tracks'}
                           </div>`
                        : '';

                    const rows = items.map((item, i) => {
                        const hex = `0x${parseInt(item.pid, 10).toString(16).toUpperCase().padStart(4, '0')}`;
                        const codecTag = item.codec
                            ? `<span class="inline-flex items-center px-2 py-[3px] rounded-md border text-[9.5px] font-extrabold tracking-wider ${getCodecStyle(item.codec)}">${item.codec}</span>`
                            : '';
                        const isNA = /^(n\/?a|-|—)$/i.test(item.lang);
                        const langTag = item.lang
                            ? `<span class="px-2 py-[3px] rounded-md border text-[9.5px] font-bold uppercase tracking-[0.12em] ${isNA ? 'bg-slate-800/40 text-slate-500 border-slate-700/50 italic' : 'bg-slate-800/80 text-slate-200 border-slate-600/60 shadow-sm'}">${item.lang}</span>`
                            : '';
                        return `<div class="pid-row flex items-center gap-2 px-2 py-1.5 rounded-xl bg-slate-900/70 border border-slate-700/50 ${hoverRow} hover:bg-slate-800/70 transition-all duration-200 w-max" style="animation-delay:${i * 45}ms" title="PID ${item.pid} · ${hex}">
                                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border font-extrabold code-font text-[11px] tracking-wider ${pidChip}">
                                        <i class="fa-solid ${icon} text-[9px] opacity-60"></i>${item.pid}
                                    </span>
                                    ${codecTag}${langTag}
                                </div>`;
                    }).join('');

                    return `<div class="flex flex-col gap-1.5">${countLabel}${rows}</div>`;
                },

                get stats() {
                    let totalTxp = this.rawData.length;
                    let totalStreams = 0, totalTv = 0, totalRadio = 0;
                    this.rawData.forEach(txp => {
                        if (txp.streams) {
                            totalStreams += txp.streams.length;
                            txp.streams.forEach(s => {
                                (s.channels || []).forEach(ch => { ch.type === 'Radio' ? totalRadio++ : totalTv++; });
                            });
                        }
                    });
                    return { totalTxp, totalStreams, totalTv, totalRadio };
                },

                get filteredData() {
                    let q = this.search.toLowerCase().trim();
                    if (!q) return this.rawData;

                    return this.rawData.map(txp => {
                        let txpMatches = txp.freq_pol_mode.toLowerCase().includes(q) || (txp.onid_nid_tid && txp.onid_nid_tid.toLowerCase().includes(q));

                        let matchingStreams = (txp.streams || []).map(stream => {
                            let streamMatches = stream.title.toLowerCase().includes(q) || (stream.pid_info && stream.pid_info.toLowerCase().includes(q));

                            let matchingChannels = (stream.channels || []).filter(ch =>
                                (ch.name && ch.name.toLowerCase().includes(q)) ||
                                (ch.sid && ch.sid.toString().includes(q)) ||
                                (ch.vpid && ch.vpid.toString().includes(q)) ||
                                (ch.apid_lang && ch.apid_lang.toLowerCase().includes(q))
                            );

                            if (streamMatches || txpMatches) {
                                return { ...stream };
                            }

                            if (matchingChannels.length > 0) {
                                return { ...stream, channels: matchingChannels };
                            }

                            return null;
                        }).filter(Boolean);

                        if (txpMatches || matchingStreams.length > 0) {
                            return { ...txp, streams: matchingStreams };
                        }
                        return null;
                    }).filter(Boolean);
                }
            };
        }
    </script>
</body>
</html>
