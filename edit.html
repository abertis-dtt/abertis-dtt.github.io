<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transponders & PIDs — Hispasat 30.0°W</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' } } } }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Alpine JS Setup -->
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #030712; color: #f3f4f6; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glass-nav { background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #030712; }
        ::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
    </style>
</head>
<body x-data="editorApp()" x-init="init()" class="min-h-screen bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-blue-950/30 via-slate-950 to-gray-950 antialiased pb-20">

    <header class="sticky top-0 z-40 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="flex items-center justify-center w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 text-white shadow-lg border border-blue-400/30">
                    <i class="fa-solid fa-pen-to-square text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold text-white tracking-tight">Transponder Editor</h1>
                    <p class="text-xs text-slate-400 font-medium">GitHub Pages Integration Mode</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="index.html" class="px-4 py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white text-xs font-bold border border-slate-700 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i><span>Back to View</span>
                </a>
                <button @click="downloadJson()" class="px-4 py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-bold border border-slate-700 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-download"></i><span>Export JSON</span>
                </button>
                <button @click="openPrModal = true" class="px-5 py-2.5 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-extrabold shadow-lg shadow-blue-500/25 border border-blue-400/30 transition-all flex items-center gap-2">
                    <i class="fa-solid fa-code-pull-request"></i><span>Create PR</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        <div class="glass-card rounded-3xl p-4 md:p-6 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center p-1.5 rounded-2xl bg-slate-900 border border-slate-800 w-full md:w-auto">
                <button @click="editorMode = 'visual'" :class="editorMode === 'visual' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'" class="px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-sitemap"></i><span>Visual Editor</span>
                </button>
                <button @click="syncToRawJson(); editorMode = 'raw'" :class="editorMode === 'raw' ? 'bg-blue-600 text-white shadow' : 'text-slate-400 hover:text-slate-200'" class="px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                    <i class="fa-solid fa-code"></i><span>Raw JSON</span>
                </button>
            </div>

            <div x-show="editorMode === 'visual'" class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" x-model="search" placeholder="Filter parameters..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-slate-900 border border-slate-800 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500">
            </div>

            <button x-show="editorMode === 'visual'" @click="addTransponder()" class="w-full md:w-auto px-5 py-2.5 rounded-2xl bg-emerald-600/10 hover:bg-emerald-600/20 text-emerald-400 text-xs font-bold border border-emerald-500/30 transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-plus-circle"></i><span>Add Transponder</span>
            </button>
        </div>

        <!-- VISUAL TREE EDITOR -->
        <div x-show="editorMode === 'visual'" class="space-y-6">
            <template x-for="(txp, tIdx) in filteredTransponders" :key="tIdx">
                <!-- Wrapper for Accordion Functionality -->
                <div x-data="{ expanded: false }" class="glass-card rounded-3xl overflow-hidden border border-slate-800 transition-all">
                    
                    <!-- Accordion Header -->
                    <div class="p-5 bg-slate-900/90 border-b border-slate-800 flex flex-col xl:flex-row xl:items-center justify-between gap-4">
                        <div class="flex items-center gap-4 cursor-pointer w-full xl:w-auto group" @click="expanded = !expanded">
                            <button class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-slate-700 transition-colors">
                                <i class="fa-solid fa-chevron-down transition-transform duration-300" :class="expanded ? 'rotate-180' : ''"></i>
                            </button>
                            <div class="w-12 h-12 rounded-2xl bg-blue-600/20 text-blue-400 flex items-center justify-center font-black text-sm border border-blue-500/30 shrink-0">
                                <span x-text="`T${txp.txp_no || '?'}`"></span>
                            </div>
                            <div class="space-y-1">
                                <span class="text-[10px] font-extrabold uppercase tracking-wider text-blue-400" x-text="`Streams: ${txp.streams ? txp.streams.length : 0}`"></span>
                                <h2 class="text-base font-bold text-white group-hover:text-blue-300 transition-colors" x-text="formatFreqPolMode(txp)"></h2>
                            </div>
                        </div>

                        <!-- Editable Settings Grid -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-9 gap-3 flex-1 xl:max-w-6xl">
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Txp No.</label>
                                <input type="text" x-model="txp.txp_no" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Freq (MHz)</label>
                                <input type="text" x-model="txp.freq" @input="updateFreqPolMode(txp)" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 font-bold focus:border-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Pol</label>
                                <select x-model="txp.pol" @change="updateFreqPolMode(txp)" class="w-full px-1 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 font-bold focus:border-blue-500 focus:outline-none">
                                    <option value="H">H</option>
                                    <option value="V">V</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Mode</label>
                                <input type="text" x-model="txp.mode" @input="updateFreqPolMode(txp)" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Sym Rate</label>
                                <input type="text" x-model="txp.symbol_rate" @input="updateSrFec(txp)" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">FEC</label>
                                <input type="text" x-model="txp.fec" @input="updateSrFec(txp)" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                            </div>
                            <!-- ADDED ONID/NID/TID FIELD -->
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">ONID/NID/TID</label>
                                <input type="text" x-model="txp.onid_nid_tid" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] code-font text-indigo-300 focus:border-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Provider</label>
                                <input type="text" x-model="txp.provider" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 focus:border-blue-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-[9px] font-bold text-slate-400 uppercase mb-1">Date</label>
                                <input type="text" x-model="txp.date" class="w-full px-2 py-1.5 rounded-lg bg-slate-950 border border-slate-800 text-[11px] text-slate-400 focus:border-blue-500 focus:outline-none">
                            </div>
                        </div>

                        <!-- Header Control Actions -->
                        <div class="flex items-center gap-2 self-end xl:self-center">
                            <button @click="addStream(tIdx); expanded = true;" class="px-3 py-1.5 rounded-lg bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/30 text-xs font-bold transition-all flex items-center gap-1">
                                <i class="fa-solid fa-plus text-[10px]"></i><span>Stream</span>
                            </button>
                            <button @click="deleteTransponder(tIdx)" class="p-1.5 px-2.5 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 transition-all text-xs">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Expandable Streams Container -->
                    <div x-show="expanded" x-collapse class="p-6 space-y-6 bg-slate-950/40">
                        <template x-for="(stream, sIdx) in txp.streams" :key="sIdx">
                            <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-4 space-y-4">
                                <div class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                                    <div class="md:col-span-5">
                                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Stream / Pipe Title</label>
                                        <input type="text" x-model="stream.title" class="w-full px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-100 font-bold focus:border-blue-500 focus:outline-none">
                                    </div>
                                    <div class="md:col-span-3">
                                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">PID Info</label>
                                        <input type="text" x-model="stream.pid_info" class="w-full px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs code-font text-emerald-400 font-bold focus:border-blue-500 focus:outline-none">
                                    </div>
                                    <div class="md:col-span-2">
                                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Encryption</label>
                                        <input type="text" x-model="stream.encryption" placeholder="BISS / FTA" class="w-full px-3 py-1.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-amber-400 font-bold focus:border-blue-500 focus:outline-none">
                                    </div>
                                    <div class="md:col-span-2 flex items-center justify-end gap-2 pt-4 md:pt-0">
                                        <button @click="addChannel(tIdx, sIdx)" class="px-3 py-1.5 rounded-xl bg-indigo-500/10 hover:bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold transition-all flex items-center gap-1.5">
                                            <i class="fa-solid fa-plus text-[10px]"></i><span>Channel</span>
                                        </button>
                                        <button @click="deleteStream(tIdx, sIdx)" class="p-2 rounded-xl bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 transition-all text-xs">
                                            <i class="fa-solid fa-trash-can"></i>
                                        </button>
                                    </div>
                                </div>

                                <div x-show="stream.channels && stream.channels.length > 0" class="overflow-x-auto rounded-xl border border-slate-800/80">
                                    <table class="w-full text-left text-xs">
                                        <thead class="bg-slate-950/80 text-slate-400 uppercase font-bold tracking-wider border-b border-slate-800">
                                            <tr>
                                                <th class="py-2.5 px-3 w-28">Type</th>
                                                <th class="py-2.5 px-3">Channel Name</th>
                                                <th class="py-2.5 px-3 w-32">Codec</th>
                                                <th class="py-2.5 px-3 w-24">SID</th>
                                                <th class="py-2.5 px-3 w-24">V.PID</th>
                                                <th class="py-2.5 px-3">A.PID / Lang</th>
                                                <th class="py-2.5 px-3 text-right w-16">Act</th>
                                            </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800/60 bg-slate-950/40">
                                            <template x-for="(ch, cIdx) in stream.channels" :key="cIdx">
                                                <tr class="hover:bg-slate-900 transition-colors">
                                                    <td class="py-2 px-3">
                                                        <select x-model="ch.type" class="w-full px-2 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-[11px] font-bold focus:outline-none"
                                                                :class="{'text-purple-300': ch.type === 'UHD', 'text-cyan-300': ch.type === 'HD', 'text-slate-300': ch.type === 'SD', 'text-emerald-300': ch.type === 'Radio'}">
                                                            <option value="HD">HD</option><option value="SD">SD</option><option value="UHD">UHD</option><option value="Radio">Radio</option>
                                                        </select>
                                                    </td>
                                                    <td class="py-2 px-3"><input type="text" x-model="ch.name" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-100 font-semibold focus:outline-none"></td>
                                                    <td class="py-2 px-3"><input type="text" x-model="ch.system" placeholder="MPEG-4" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-400 focus:outline-none"></td>
                                                    <td class="py-2 px-3"><input type="text" x-model="ch.sid" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs code-font text-blue-400 font-bold focus:outline-none"></td>
                                                    <td class="py-2 px-3"><input type="text" x-model="ch.vpid" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs code-font text-indigo-300 font-bold focus:outline-none"></td>
                                                    <td class="py-2 px-3"><input type="text" x-model="ch.apid_lang" class="w-full px-2.5 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs code-font text-slate-300 focus:outline-none"></td>
                                                    <td class="py-2 px-3 text-right">
                                                        <button @click="deleteChannel(tIdx, sIdx, cIdx)" class="p-1.5 rounded-lg text-slate-500 hover:text-red-400 hover:bg-slate-800 transition-colors">
                                                            <i class="fa-solid fa-xmark"></i>
                                                        </button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>

        <!-- RAW JSON EDITOR -->
        <div x-show="editorMode === 'raw'" class="glass-card rounded-3xl p-6 space-y-4">
            <div class="flex items-center justify-between">
                <label for="rawJsonArea" class="text-xs font-bold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-code text-blue-400"></i><span>Raw JSON Editor</span>
                </label>
                <button @click="formatRawJson()" class="px-3 py-1 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold transition-all">Format JSON</button>
            </div>
            <textarea id="rawJsonArea" x-model="rawJsonText" rows="28" class="w-full p-4 rounded-2xl bg-slate-950 border border-slate-800 text-xs text-slate-200 code-font focus:outline-none focus:border-blue-500 leading-relaxed"></textarea>
        </div>
    </main>

    <!-- PR Modal omitted for brevity, structurally identical but kept active in your local code -->
    
    <script>
        function editorApp() {
            return {
                editorMode: 'visual',
                search: '',
                transponders: [],
                rawJsonText: '',
                openPrModal: false, prLoading: false, prStatus: { error: false, message: '' },
                github: { owner: '', repo: '', branch: 'main', token: '', prTitle: 'Update satellite transponder dataset' },

                async init() {
                    try {
                        let response = await fetch('sat_data.json');
                        let data = await response.json();
                        this.transponders = data.map(txp => this.parseTxpFields(txp));
                        this.syncToRawJson();
                    } catch (e) { console.error("Could not fetch sat_data.json", e); }
                },
                parseTxpFields(txp) {
                    let freq = '', pol = 'H', mode = 'DVB-S2/8PSK', sr = '', fec = '';
                    if (txp.freq_pol_mode) {
                        let parts = txp.freq_pol_mode.split(' ');
                        freq = parts[0] || ''; pol = parts[1] || 'H'; mode = parts.slice(2).join(' ') || '';
                    }
                    if (txp.sr_fec) {
                        let parts = txp.sr_fec.split(' ');
                        sr = parts[0] || ''; fec = parts[1] || '';
                    }
                    return { ...txp, freq, pol, mode, symbol_rate: sr, fec };
                },
                formatFreqPolMode(txp) { return `${txp.freq || ''} ${txp.pol || 'H'} ${txp.mode || ''}`.trim(); },
                updateFreqPolMode(txp) { txp.freq_pol_mode = this.formatFreqPolMode(txp); },
                updateSrFec(txp) { txp.sr_fec = `${txp.symbol_rate || ''} ${txp.fec || ''}`.trim(); },
                
                syncToRawJson() {
                    let cleaned = this.transponders.map(txp => {
                        let clone = { ...txp };
                        // Remove temporary UI layout state variables
                        delete clone.freq; delete clone.pol; delete clone.mode; 
                        delete clone.symbol_rate; delete clone.fec;
                        return clone;
                    });
                    this.rawJsonText = JSON.stringify(cleaned, null, 4);
                },
                syncFromRawJson() {
                    try {
                        let parsed = JSON.parse(this.rawJsonText);
                        if (Array.isArray(parsed)) {
                            this.transponders = parsed.map(txp => this.parseTxpFields(txp));
                            return true;
                        }
                    } catch (e) { alert("Invalid JSON: " + e.message); return false; }
                },
                get filteredTransponders() {
                    if (!this.search.trim()) return this.transponders;
                    let q = this.search.toLowerCase().trim();
                    return this.transponders.filter(txp => {
                        let matchTxp = (txp.txp_no && txp.txp_no.toLowerCase().includes(q)) ||
                                       (txp.freq_pol_mode && txp.freq_pol_mode.toLowerCase().includes(q)) ||
                                       (txp.provider && txp.provider.toLowerCase().includes(q)) ||
                                       (txp.onid_nid_tid && txp.onid_nid_tid.toLowerCase().includes(q)); // Ensure ID search works
                        let matchStream = (txp.streams || []).some(s => 
                            (s.title && s.title.toLowerCase().includes(q)) ||
                            (s.pid_info && s.pid_info.toLowerCase().includes(q)) ||
                            (s.channels || []).some(c => c.name && c.name.toLowerCase().includes(q))
                        );
                        return matchTxp || matchStream;
                    });
                },
                addTransponder() {
                    this.transponders.unshift({
                        txp_no: "NEW", freq: "11000.00", pol: "H", mode: "DVB-S2", freq_pol_mode: "11000.00 H DVB-S2",
                        provider: "New Provider", symbol_rate: "30000", fec: "3/4", sr_fec: "30000 3/4",
                        onid_nid_tid: "1/1/1", date: new Date().toLocaleDateString('de-DE'), streams: []
                    });
                },
                deleteTransponder(tIdx) { if (confirm(`Delete Transponder #${this.transponders[tIdx].txp_no}?`)) this.transponders.splice(tIdx, 1); },
                addStream(tIdx) {
                    if (!this.transponders[tIdx].streams) this.transponders[tIdx].streams = [];
                    this.transponders[tIdx].streams.push({ title: "New Stream Pipe", pid_info: "0-0--0", encryption: "BISS", channels: [] });
                },
                deleteStream(tIdx, sIdx) { if (confirm("Delete Stream?")) this.transponders[tIdx].streams.splice(sIdx, 1); },
                addChannel(tIdx, sIdx) {
                    if (!this.transponders[tIdx].streams[sIdx].channels) this.transponders[tIdx].streams[sIdx].channels = [];
                    this.transponders[tIdx].streams[sIdx].channels.push({ type: "HD", name: "New Channel", system: "MPEG-4", sid: "1", vpid: "101", apid_lang: "102 Spa" });
                },
                deleteChannel(tIdx, sIdx, cIdx) { this.transponders[tIdx].streams[sIdx].channels.splice(cIdx, 1); },
                formatRawJson() { try { this.rawJsonText = JSON.stringify(JSON.parse(this.rawJsonText), null, 4); } catch (e) { alert("Invalid JSON"); } },
                getExportJson() {
                    if (this.editorMode === 'raw') this.syncFromRawJson();
                    this.syncToRawJson();
                    return this.rawJsonText;
                },
                downloadJson() {
                    let a = document.createElement('a');
                    a.href = URL.createObjectURL(new Blob([this.getExportJson()], { type: "application/json" }));
                    a.download = 'sat_data.json';
                    a.click();
                }
            };
        }
    </script>
</body>
</html>
